<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Mehmet Salih Yaldız, Full Stack Developer">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#eaeef2"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="340" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="#ffffff"/>
    <rect width="1200" height="340" fill="url(#dots)"/>
    <rect width="760" height="340" fill="url(#fade)"/>
    <rect x="0" y="0" width="1200" height="4" fill="#0969da"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="339" rx="18" fill="none" stroke="#d0d7de"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <circle cx="72" cy="88" r="5" fill="#1a7f37"/>
    <text x="86" y="93" font-size="15" font-weight="600" fill="#1a7f37" letter-spacing="0.4">Freelance projelere açık</text>
    <text x="64" y="166" font-size="58" font-weight="800" fill="#1f2328" letter-spacing="-1.5">Mehmet Salih</text>
    <text x="64" y="228" font-size="58" font-weight="800" fill="#0969da" letter-spacing="-1.5">Yaldız</text>
    <text x="64" y="276" font-size="19" font-weight="500" fill="#59636e">Full Stack Developer · Web, mobil ve otomasyon · Konya</text>
  </g>

  <g>
    <rect x="684" y="64" width="452" height="236" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
    <line x1="684" y1="104" x2="1136" y2="104" stroke="#d0d7de"/>
    <circle cx="708" cy="84" r="6" fill="#ff5f57"/>
    <circle cx="728" cy="84" r="6" fill="#febc2e"/>
    <circle cx="748" cy="84" r="6" fill="#28c840"/>
    <text x="1112" y="89" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#59636e">salih.ts</text>
    <text x="712" y="136" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" xml:space="preserve"><tspan fill="#8250df">const </tspan><tspan fill="#1f2328">salih</tspan><tspan fill="#59636e"> = {</tspan></text>
    <text x="712" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" xml:space="preserve"><tspan fill="#0969da">  rol</tspan><tspan fill="#59636e">: </tspan><tspan fill="#0a3069">"Full Stack Developer"</tspan><tspan fill="#59636e">,</tspan></text>
    <text x="712" y="184" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" xml:space="preserve"><tspan fill="#0969da">  sehir</tspan><tspan fill="#59636e">: </tspan><tspan fill="#0a3069">"Konya"</tspan><tspan fill="#59636e">,</tspan></text>
    <text x="712" y="208" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" xml:space="preserve"><tspan fill="#0969da">  stack</tspan><tspan fill="#59636e">: [</tspan><tspan fill="#0a3069">"TS"</tspan><tspan fill="#59636e">, </tspan><tspan fill="#0a3069">"PHP"</tspan><tspan fill="#59636e">, </tspan><tspan fill="#0a3069">"Python"</tspan><tspan fill="#59636e">],</tspan></text>
    <text x="712" y="232" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" xml:space="preserve"><tspan fill="#0969da">  odak</tspan><tspan fill="#59636e">: </tspan><tspan fill="#0a3069">"microservices"</tspan><tspan fill="#59636e">,</tspan></text>
    <text x="712" y="256" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" xml:space="preserve"><tspan fill="#0969da">  freelance</tspan><tspan fill="#59636e">: </tspan><tspan fill="#953800">true</tspan><tspan fill="#59636e">,</tspan></text>
    <text x="712" y="280" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" xml:space="preserve"><tspan fill="#59636e">};</tspan></text>
  </g>
</svg>
