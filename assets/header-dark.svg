<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Mehmet Salih Yaldız, Full Stack Developer">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#21262d"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#0d1117" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#0d1117" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="340" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="#0d1117"/>
    <rect width="1200" height="340" fill="url(#dots)"/>
    <rect width="760" height="340" fill="url(#fade)"/>
    <rect x="0" y="0" width="1200" height="4" fill="#58a6ff"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="339" rx="18" fill="none" stroke="#30363d"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <circle cx="72" cy="88" r="5" fill="#3fb950"/>
    <text x="86" y="93" font-size="15" font-weight="600" fill="#3fb950" letter-spacing="0.4">Freelance projelere açık</text>
    <text x="64" y="166" font-size="58" font-weight="800" fill="#e6edf3" letter-spacing="-1.5">Mehmet Salih</text>
    <text x="64" y="228" font-size="58" font-weight="800" fill="#58a6ff" letter-spacing="-1.5">Yaldız</text>
    <text x="64" y="276" font-size="19" font-weight="500" fill="#8b949e">Full Stack Developer · Web, mobil ve otomasyon · Konya</text>
  </g>

  <g>
    <rect x="684" y="64" width="452" height="236" rx="12" fill="#161b22" stroke="#30363d"/>
    <line x1="684" y1="104" x2="1136" y2="104" stroke="#30363d"/>
    <circle cx="708" cy="84" r="6" fill="#ff5f57"/>
    <circle cx="728" cy="84" r="6" fill="#febc2e"/>
    <circle cx="748" cy="84" r="6" fill="#28c840"/>
    <text x="1112" y="89" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#8b949e">salih.ts</text>
    <text x="712" y="136" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" xml:space="preserve"><tspan fill="#d2a8ff">const </tspan><tspan fill="#e6edf3">salih</tspan><tspan fill="#8b949e"> = {</tspan></text>
    <text x="712" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" xml:space="preserve"><tspan fill="#58a6ff">  rol</tspan><tspan fill="#8b949e">: </tspan><tspan fill="#a5d6ff">"Full Stack Developer"</tspan><tspan fill="#8b949e">,</tspan></text>
    <text x="712" y="184" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" xml:space="preserve"><tspan fill="#58a6ff">  sehir</tspan><tspan fill="#8b949e">: </tspan><tspan fill="#a5d6ff">"Konya"</tspan><tspan fill="#8b949e">,</tspan></text>
    <text x="712" y="208" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" xml:space="preserve"><tspan fill="#58a6ff">  stack</tspan><tspan fill="#8b949e">: [</tspan><tspan fill="#a5d6ff">"TS"</tspan><tspan fill="#8b949e">, </tspan><tspan fill="#a5d6ff">"PHP"</tspan><tspan fill="#8b949e">, </tspan><tspan fill="#a5d6ff">"Python"</tspan><tspan fill="#8b949e">],</tspan></text>
    <text x="712" y="232" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" xml:space="preserve"><tspan fill="#58a6ff">  odak</tspan><tspan fill="#8b949e">: </tspan><tspan fill="#a5d6ff">"microservices"</tspan><tspan fill="#8b949e">,</tspan></text>
    <text x="712" y="256" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" xml:space="preserve"><tspan fill="#58a6ff">  freelance</tspan><tspan fill="#8b949e">: </tspan><tspan fill="#ffa657">true</tspan><tspan fill="#8b949e">,</tspan></text>
    <text x="712" y="280" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" xml:space="preserve"><tspan fill="#8b949e">};</tspan></text>
  </g>
</svg>
